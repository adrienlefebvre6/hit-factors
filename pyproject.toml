[project]
name = "hit-factors"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "quinneecorn", email = "quannm8904@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "bertopic>=0.17.4",
    "better-profanity>=0.7.0",
    "duckdb>=1.5.6",
    "hdbscan>=0.8.44",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "lexicalrichness>=0.5.1",
    "nltk>=3.10.4",
    "pandarallel>=1.6.5",
    "pandas>=3.0.6",
    "sentence-transformers>=6.2.0",
    "tqdm>=4.70.1",
    "umap-learn>=0.5.12",
]

[project.scripts]
hit-factors = "hit_factors:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.1.0"]
build-backend = "uv_build"

[tool.uv]
package = false
