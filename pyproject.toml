[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hit-factors"
version = "0.1.0"
description = "Fonctions partagées du projet : chemins, chargement des données, normalisation des titres et artistes"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
